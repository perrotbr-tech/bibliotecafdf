<html lang="es">
<head>
<meta charset="utf-8">

<body>
<title>Préstamos de la Biblioteca</title>
<style>
/* Layout: app de una columna para el teléfono. Barra superior fija, contenido que fluye,
   navegación inferior de cinco destinos. El detalle propio del tema es el tejuelo:
   la etiqueta de lomo con el código del libro, coloreada por categoría. */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --sunk:#E9EEE8; --fg:#16211B; --muted:#5A6860; --line:#D5DDD6;
  --accent:#1D6A50; --accent-fg:#FFFFFF; --accent-soft:#DDEEE6;
  --late:#B3301C; --late-soft:#FBE4DF; --warn:#8A5A00; --warn-soft:#FBEFD2; --ok:#1D6A50; --ok-soft:#DDEEE6;
  --c-inf:#B4530A; --c-hm:#7A3FA0; --c-fam:#B02A5B; --c-vc:#1F5FA8; --c-nv:#2E7D32; --c-teo:#4A5560;
  --oro:#D9A514; --plata:#9BA6AF; --bronce:#B8743C; --med-ink:#1E1806;
  --shadow:0 8px 28px rgba(22,33,27,.16);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#18211C; --sunk:#131A16; --fg:#E7EEE9; --muted:#97A79E; --line:#2B3831;
    --accent:#5FC6A1; --accent-fg:#0B1410; --accent-soft:#1D3229;
    --late:#FF8D77; --late-soft:#3A1D17; --warn:#E9B955; --warn-soft:#33290F; --ok:#5FC6A1; --ok-soft:#1D3229;
    --c-inf:#F0A45B; --c-hm:#C79BE6; --c-fam:#F08DB0; --c-vc:#7FB4F0; --c-nv:#86CF8A; --c-teo:#AEBAC4;
    --oro:#EDBE3A; --plata:#BAC4CC; --bronce:#D08D55; --med-ink:#1E1806;
    --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --sunk:#131A16; --fg:#E7EEE9; --muted:#97A79E; --line:#2B3831;
  --accent:#5FC6A1; --accent-fg:#0B1410; --accent-soft:#1D3229;
  --late:#FF8D77; --late-soft:#3A1D17; --warn:#E9B955; --warn-soft:#33290F; --ok:#5FC6A1; --ok-soft:#1D3229;
  --c-inf:#F0A45B; --c-hm:#C79BE6; --c-fam:#F08DB0; --c-vc:#7FB4F0; --c-nv:#86CF8A; --c-teo:#AEBAC4;
  --oro:#EDBE3A; --plata:#BAC4CC; --bronce:#D08D55; --med-ink:#1E1806;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
.wrap{max-width:720px;margin-inline:auto;padding-inline:16px}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px}
.top h1{font-size:20px;flex:1;min-width:0;overflow-wrap:anywhere}
.top .hoy{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;min-height:44px;font-size:20px;line-height:1}

main{padding-block:16px 112px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.sec{font-size:17px;margin-top:8px}
.sub{color:var(--muted);font-size:14px}

/* navegación inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:4px}
.tab{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--late);color:var(--surface);font-size:11px;font-family:var(--f-mono);display:flex;align-items:center;justify-content:center;padding:0 4px}

/* cifras de inicio */
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cifra{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.cifra b{font-family:var(--f-display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.cifra span{font-size:13px;color:var(--muted);font-weight:600}
.cifra.late b{color:var(--late)}

/* botones */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg);text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.wa{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.btn.danger{color:var(--late);border-color:var(--late)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.fila-btn{display:flex;gap:8px;flex-wrap:wrap}
.fila-btn>.btn{flex:1 1 140px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}

/* tejuelo: etiqueta de lomo */
.tej{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.02em;border:1.5px solid currentColor;border-radius:4px;padding:1px 6px;white-space:nowrap;color:var(--c-teo);background:var(--surface);display:inline-block}
.tej[data-p="INF"]{color:var(--c-inf)} .tej[data-p="HM"]{color:var(--c-hm)} .tej[data-p="FAM"]{color:var(--c-fam)}
.tej[data-p="VC"]{color:var(--c-vc)} .tej[data-p="NV"]{color:var(--c-nv)} .tej[data-p="TEO"]{color:var(--c-teo)}

/* píldoras de estado */
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.off{background:var(--sunk);color:var(--muted)}

/* listas */
.lista{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
button.item{background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.fecha{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.vacio{padding:20px 14px;color:var(--muted);text-align:center}

/* formularios */
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:14px;font-weight:700}
.in{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:10px 14px;width:100%}
textarea.in{min-height:120px;resize:vertical}
.err{color:var(--late);font-size:14px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:6px 14px;font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;min-height:40px;font-weight:700;font-size:14px;color:var(--muted);padding:4px 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}

/* pasos de prestar */
.paso{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.paso>h2{font-size:16px;display:flex;gap:10px;align-items:center}
.paso>h2 i{font-style:normal;font-family:var(--f-mono);font-size:13px;width:26px;height:26px;border-radius:50%;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;flex:none}
.paso.listo>h2 i{background:var(--accent);color:var(--accent-fg)}
.elegido{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.elegido>div{min-width:0;display:flex;flex-direction:column;gap:4px}
.sublista{border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:320px;overflow-y:auto}

/* avisos */
.nota{background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.nota b{color:var(--warn)}
.nota.info{background:var(--accent-soft)} .nota.info b{color:var(--accent)}

/* barras de estadísticas */
.barra{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.barra .n{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.barra .riel{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.barra .riel i{display:block;height:100%;background:var(--accent);border-radius:4px}
.meses{display:flex;align-items:flex-end;gap:4px}
.mes{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.mes i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0}
.mes .v{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.mes .l{font-family:var(--f-mono);font-size:10px;color:var(--muted);height:26px;text-align:center;line-height:1.25}

/* hoja inferior */
.velo{position:fixed;inset:0;z-index:40;background:rgba(10,16,13,.55);display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--bg);width:100%;max-width:720px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.hoja-cab{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.hoja-cab h2{font-size:20px;min-width:0;overflow-wrap:anywhere}
.cerrar{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:44px;min-height:44px;font-size:18px;flex:none}

/* aviso flotante */
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;margin-inline:auto;max-width:560px;background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;box-shadow:var(--shadow);font-weight:600}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:36px;flex:none}
.med{flex:none;display:block}
.med .cinta{fill:var(--accent)} .med .cinta2{fill:var(--fg)} .med .num{font-family:var(--f-mono);font-weight:600;fill:var(--med-ink)}
.med .aro{fill:none;stroke:var(--med-ink);stroke-opacity:.28;stroke-width:1.2}
.med.m1 .disco{fill:var(--oro)} .med.m2 .disco{fill:var(--plata)} .med.m3 .disco{fill:var(--bronce)}
.tempnav{display:flex;align-items:center;gap:12px}
.tempt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.tempt b{font-family:var(--f-display);font-size:22px;line-height:1.1}
.back[disabled]{opacity:.35;cursor:not-allowed}
.podio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 12px 0}
.pd{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.pd .pn{font-weight:700;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.pd .pp{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.escalon{width:100%;margin-top:4px;border-radius:8px 8px 0 0;background:var(--sunk);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-family:var(--f-display);font-size:22px;color:var(--muted);transform-origin:bottom}
.escalon.e1{height:92px;background:var(--accent-soft);color:var(--accent)} .escalon.e2{height:64px} .escalon.e3{height:42px}
@media (prefers-reduced-motion:no-preference){.escalon{animation:crece .5s cubic-bezier(.2,.8,.2,1) both}.escalon.e2{animation-delay:.08s}.escalon.e3{animation-delay:.16s}@keyframes crece{from{transform:scaleY(.25)}to{transform:none}}}
.reglas{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.regla{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.regla:first-child{border-top:0}
.regla .pts{flex:none;width:44px;font-family:var(--f-display);font-size:22px;text-align:right;font-variant-numeric:tabular-nums}
.regla .pts small{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-left:2px}
.rank .punt{flex:none;font-family:var(--f-display);font-size:20px;line-height:32px;font-variant-numeric:tabular-nums;text-align:right}
.rank .punt small{display:block;font-family:var(--f-mono);font-size:10px;line-height:1;color:var(--muted)}
.pie{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--accent-soft);color:var(--fg);padding:0;text-align:left}
.pie-in{display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:50px;max-width:720px;margin-inline:auto;padding:5px 16px}
.pie .fila{display:flex;align-items:center;gap:10px;min-width:0}
.pie .et{font-family:var(--f-mono);font-size:10px;line-height:1.2;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);font-weight:600}
.pie .g{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:4px;font-size:13px}
.pie .g span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.pie .g i{flex:none;font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pie .sin{font-size:13px;font-weight:600;min-width:0}
body.conpie main{padding-bottom:168px}
body.conpie .toast{bottom:calc(128px + env(safe-area-inset-bottom,0px))}
.rank .item{flex-direction:row;align-items:flex-start;gap:12px}
.rank .cuerpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pos{flex:none;width:32px;height:32px;border-radius:50%;background:var(--sunk);color:var(--fg);font-family:var(--f-mono);font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pos.top{background:var(--accent);color:var(--accent-fg)}
.barra span{min-width:0;overflow-wrap:anywhere}
.destaca{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.destaca b{font-family:var(--f-display);font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.menu .item{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.menu .item .ch{color:var(--muted);font-size:20px}
.copia{font-family:var(--f-mono);font-size:12px;min-height:160px}
@media (prefers-reduced-motion:no-preference){.hoja{animation:sube .18s ease-out}@keyframes sube{from{transform:translateY(24px)}to{transform:none}}}
@media (min-width:640px){.cifra b{font-size:40px}}
</style>

<script>
(function(){
'use strict';
var SEED = JSON.parse(document.getElementById('semilla').textContent);
var KEY = 'biblioteca-prestamos-v1';
var MSG = 'Hola {nombre}, te escribimos de la biblioteca. El libro «{titulo}» venció el {fecha}. ¿Puedes traerlo este sábado? ¡Gracias!';
var PREF = {'Infantil':'INF','Hombres y mujeres':'HM','Familia':'FAM','Vida Cristiana':'VC','Novelas':'NV','Teología':'TEO'};
var DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ---------- estado ---------- */
function nuevo(){
  return JSON.parse(JSON.stringify({
    books: SEED.books, readers: SEED.readers, loans: SEED.loans,
    settings: {name:'Biblioteca', days:14, msg:MSG},
    seq: SEED.seq, rseq: SEED.readers.length, descartes: []
  }));
}
function esFecha(s){ return typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function valido(o){
  try{
    if(!o || typeof o!=='object') return false;
    if(!Array.isArray(o.books)||!Array.isArray(o.readers)||!Array.isArray(o.loans)||!Array.isArray(o.descartes)) return false;
    if(!o.settings || typeof o.settings.name!=='string' || typeof o.settings.msg!=='string') return false;
    if([7,14,21,28].indexOf(o.settings.days)<0) return false;
    if(typeof o.seq!=='number' || typeof o.rseq!=='number') return false;
    var codes={}, ids={};
    for(var i=0;i<o.books.length;i++){ var b=o.books[i]; if(!b||typeof b.code!=='string'||typeof b.title!=='string'||typeof b.cat!=='string') return false; codes[b.code]=1; }
    for(i=0;i<o.readers.length;i++){ var r=o.readers[i]; if(!r||typeof r.id!=='string'||typeof r.name!=='string') return false; ids[r.id]=1; }
    for(i=0;i<o.loans.length;i++){ var l=o.loans[i]; if(!l||typeof l.id!=='string'||!codes[l.book]||!ids[l.reader]||!esFecha(l.out)||!esFecha(l.due)) return false; }
    return true;
  }catch(e){ return false; }
}
var guardadoRoto = false;
function cargar(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var o = JSON.parse(raw); if(valido(o)) return o; guardadoRoto = true; }
  }catch(e){ guardadoRoto = true; }
  return nuevo();
}
function guardar(){ ver+=1; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
var S = cargar();

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function p2(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function hoy(){ return iso(new Date()); }
function aFecha(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function suma(s,n){ var d=aFecha(s); d.setDate(d.getDate()+n); return iso(d); }
function dif(a,b){ return Math.round((aFecha(a)-aFecha(b))/86400000); }
function f(s,conAnio){ if(!s) return 'sin fecha'; var d=aFecha(s); return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]+((conAnio||d.getFullYear()!==new Date().getFullYear())?' '+d.getFullYear():''); }
function fx(s){ if(!s) return ''; var p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function llave(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim(); }
function pref(code){ var m=/^[A-Z]+/.exec(code); return m?m[0]:''; }
function tej(code){ return '<span class="tej" data-p="'+esc(pref(code))+'">'+esc(code)+'</span>'; }
function libro(code){ for(var i=0;i<S.books.length;i++) if(S.books[i].code===code) return S.books[i]; return null; }
function lector(id){ for(var i=0;i<S.readers.length;i++) if(S.readers[i].id===id) return S.readers[i]; return null; }
function abiertos(){ return S.loans.filter(function(l){return !l.ret;}); }
function atrasado(l){ return !l.ret && l.due < hoy(); }
var ver=0, idxV=-1, idx=null;
function abiertoDe(code){
  if(idxV!==ver){ idx={}; S.loans.forEach(function(l){ if(!l.ret) (idx[l.book]=idx[l.book]||[]).push(l); }); idxV=ver; }
  return idx[code]||[];
}
function estado(b){
  if(b.baja) return {k:'off',t:'Dado de baja'};
  var a=abiertoDe(b.code);
  if(!a.length) return {k:'ok',t:'Disponible'};
  return a.some(atrasado) ? {k:'late',t:'Atrasado'} : {k:'warn',t:'Prestado'};
}
function pill(e){ return '<span class="pill '+e.k+'">'+esc(e.t)+'</span>'; }
function plural(n,a,b){ return n+' '+(n===1?a:b); }
function pillPrestamo(l){
  if(l.ret) return '<span class="pill off">Devuelto</span>';
  var d=dif(l.due,hoy());
  if(d<=-60) return '<span class="pill late">Atrasado '+Math.floor(-d/30)+' meses</span>';
  if(d<0) return '<span class="pill late">Atrasado '+plural(-d,'día','días')+'</span>';
  if(d===0) return '<span class="pill warn">Vence hoy</span>';
  return '<span class="pill ok">Vence en '+plural(d,'día','días')+'</span>';
}
function mensaje(l){
  var r=lector(l.reader), b=libro(l.book);
  return S.settings.msg.replace(/\{nombre\}/g,(r?r.name:'').split(' ')[0]).replace(/\{titulo\}/g,b?b.title:'').replace(/\{fecha\}/g,f(l.due,true));
}
function enlaceWA(l){
  var r=lector(l.reader), tel=(r&&r.phone)?r.phone:'';
  return 'https://wa.me/'+tel+'?text='+encodeURIComponent(mensaje(l));
}
function posteriorMismoLibro(l){
  return S.loans.some(function(o){ return o.id!==l.id && o.book===l.book && o.out>l.out; });
}

/* ---------- acciones sobre los datos ---------- */
function prestar(code, rid, dias){
  var b=libro(code), r=lector(rid);
  if(!b) return 'Ese libro no está en el catálogo.';
  if(b.baja) return 'Ese libro está dado de baja.';
  if(!r) return 'Elige un lector.';
  if([7,14,21,28].indexOf(dias)<0) return 'Elige un plazo.';
  if(abiertoDe(code).length) return 'Ese libro ya está prestado. Registra primero su devolución.';
  S.seq+=1;
  var id='P'+(S.seq<1000?('00'+S.seq).slice(-3):S.seq);
  while(S.loans.some(function(l){return l.id===id;})){ S.seq+=1; id='P'+(S.seq<1000?('00'+S.seq).slice(-3):S.seq); }
  S.loans.push({id:id,book:code,reader:rid,out:hoy(),due:suma(hoy(),dias),ret:false,back:null});
  guardar(); return {id:id};
}
function devolver(id){
  var l=S.loans.filter(function(x){return x.id===id;})[0];
  if(!l||l.ret) return false;
  l.ret=true; l.back=hoy(); guardar(); return true;
}
function normTel(t){
  var d=String(t||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.length===9 && d[0]==='9') return '56'+d;
  if(d.length===11 && d.indexOf('569')===0) return d;
  return null;
}
function crearLector(nombre, tel){
  var n=String(nombre||'').replace(/\s+/g,' ').trim();
  if(n.length<3) return {e:'Escribe el nombre y el apellido.'};
  if(n.length>60) return {e:'El nombre es demasiado largo (máximo 60 letras).'};
  if(S.readers.some(function(r){return llave(r.name)===llave(n);})) return {e:'Ya existe un lector con ese nombre. Búscalo en la lista.'};
  var t=normTel(tel);
  if(t===null) return {e:'El teléfono debe tener 9 dígitos y empezar con 9. Ejemplo: 9 1234 5678.'};
  S.rseq+=1; var id='L'+('00'+S.rseq).slice(-3);
  while(lector(id)){ S.rseq+=1; id='L'+S.rseq; }
  var r={id:id,name:n,tel:!!t}; if(t) r.phone=t;
  S.readers.push(r); guardar(); return {r:r};
}
function sugerirCodigo(cat){
  var p=PREF[cat]||'LIB', max=0;
  S.books.forEach(function(b){ var m=new RegExp('^'+p+'(\\d+)').exec(b.code); if(m) max=Math.max(max,+m[1]); });
  return p+('00'+(max+1)).slice(-3);
}
function crearLibro(code,title,author,cat){
  var c=String(code||'').replace(/\s+/g,'').toUpperCase(), t=String(title||'').replace(/\s+/g,' ').trim();
  if(!/^[A-Z]{2,4}\d{3,4}[A-Z]?$/.test(c)) return {e:'El código lleva letras y tres números. Ejemplo: VC062.'};
  if(libro(c)) return {e:'El código '+c+' ya existe.'};
  if(t.length<2) return {e:'Escribe el título.'};
  if(t.length>120) return {e:'El título es demasiado largo (máximo 120 letras).'};
  if(SEED.cats.indexOf(cat)<0) return {e:'Elige una categoría.'};
  S.books.push({code:c,title:t,author:String(author||'').replace(/\s+/g,' ').trim().slice(0,80),cat:cat});
  guardar(); return {b:c};
}
function unir(a,b){
  var ra=lector(a), rb=lector(b); if(!ra||!rb||a===b) return false;
  S.loans.forEach(function(l){ if(l.reader===b) l.reader=a; });
  if(rb.tel) ra.tel=true; if(rb.phone&&!ra.phone) ra.phone=rb.phone;
  S.readers=S.readers.filter(function(r){return r.id!==b;});
  guardar(); return true;
}

/* ---------- navegación ---------- */
var ruta='inicio', pila=[];
var ui={ q:'', cat:'', est:'todos', filtro:'curso', lim:40, rmodo:'temp', temp:null, pr:{book:null,reader:null,days:null,q:'',cat:'',rq:'',alta:false,err:''}, err:'', confirma:false, copia:'' };
var TITULOS={inicio:null,prestar:'Prestar un libro',prestamos:'Préstamos',catalogo:'Catálogo',mas:'Más',lectores:'Lectores',estadisticas:'Estadísticas',ranking:'Ranking',revisar:'Datos por revisar',exportar:'Copiar para Excel',ajustes:'Ajustes',altalibro:'Agregar libro'};
var RAIZ=['inicio','prestar','prestamos','catalogo','mas'];
function ir(r, guardarPila){
  if(guardarPila) pila.push(ruta); else if(RAIZ.indexOf(r)>=0) pila=[];
  ruta=r; ui.q=''; ui.err=''; ui.lim=(r==='ranking'?10:40); ui.confirma=false; ui.copia='';
  if(r==='catalogo'){ ui.cat=''; ui.est='todos'; }
  pintar(); window.scrollTo(0,0);
}

/* ---------- vistas ---------- */
function vInicio(){
  var ab=abiertos(), late=ab.filter(atrasado).sort(function(a,b){return a.due<b.due?-1:1;});
  var prestados={}; ab.forEach(function(l){prestados[l.book]=1;});
  var disp=S.books.filter(function(b){return !b.baja && !prestados[b.code];}).length;
  var h='<div class="stack">';
  if(guardadoRoto) h+='<div class="nota"><b>No se pudo leer lo guardado en este teléfono.</b>Se cargaron de nuevo los datos de ejemplo.</div>';
  h+='<div class="cifras">'+
    '<button class="cifra" data-act="filtro" data-f="curso"><b>'+ab.length+'</b><span>En curso</span></button>'+
    '<button class="cifra late" data-act="filtro" data-f="atrasados"><b>'+late.length+'</b><span>Atrasados</span></button>'+
    '<button class="cifra" data-act="disponibles"><b>'+disp+'</b><span>Disponibles</span></button></div>';
  h+='<div class="fila-btn"><button class="btn pri" data-act="ir" data-r="prestar">Prestar un libro</button><button class="btn" data-act="filtro" data-f="curso">Registrar devolución</button></div>';
  h+='<h2 class="sec">Más tiempo atrasados</h2>';
  if(late.length){
    h+='<div class="lista">'+late.slice(0,4).map(filaPrestamo).join('')+'</div>';
    if(late.length>4) h+='<button class="link" data-act="filtro" data-f="atrasados">Ver los '+late.length+' atrasados</button>';
  } else h+='<div class="lista"><div class="vacio">Ningún préstamo atrasado.</div></div>';
  var ult=S.loans.slice().sort(function(a,b){return a.out<b.out?1:(a.out>b.out?-1:(a.id<b.id?1:-1));}).slice(0,5);
  h+='<h2 class="sec">Últimos préstamos</h2><div class="lista">'+ult.map(function(l){
    var b=libro(l.book), r=lector(l.reader);
    return '<div class="item"><div class="meta">'+tej(l.book)+pillPrestamo(l)+'</div><div class="t">'+esc(b.title)+'</div><div class="m">'+esc(r.name)+' · '+f(l.out)+'</div></div>';
  }).join('')+'</div>';
  h+='<div class="nota info"><b>Esto es un prototipo.</b>Trae datos de ejemplo inventados. Lo que registres se guarda solo en este teléfono y no lo ven los demás voluntarios. En «Más» puedes volver a los datos originales.</div>';
  return h+'</div>';
}
function filaPrestamo(l){
  var b=libro(l.book), r=lector(l.reader), late=atrasado(l);
  var h='<div class="item"><div class="meta">'+tej(l.book)+pillPrestamo(l)+'</div><div class="t">'+esc(b.title)+'</div>'+
    '<div class="m">'+esc(r.name)+'</div><div class="fecha">'+esc(l.id)+' · salió '+f(l.out)+' · vence '+f(l.due)+(l.ret?(' · volvió '+(l.back?f(l.back):'sin fecha registrada')):'')+'</div>';
  if(!l.ret){
    h+='<div class="fila-btn"><button class="btn sm pri" data-act="devolver" data-id="'+esc(l.id)+'">Devolver</button>';
    if(late) h+='<a class="btn sm wa" href="'+esc(enlaceWA(l))+'" target="_blank" rel="noopener">Recordar por WhatsApp</a><button class="btn sm" data-act="copiarmsg" data-id="'+esc(l.id)+'">Copiar mensaje</button>';
    h+='</div>';
  }
  return h+'</div>';
}
function listaPrestamos(){
  var q=llave(ui.q), arr;
  if(ui.filtro==='curso') arr=abiertos().sort(function(a,b){return a.due<b.due?-1:1;});

function tempDe(fecha){ return fecha.slice(0,4)+'-'+Math.floor((+fecha.slice(5,7)-1)/2); }
function tempInfo(id){
  var p=id.split('-'), y=+p[0], k=+p[1], m1=k*2+1, m2=m1+1;
  return {id:id, ini:y+'-'+p2(m1)+'-01', fin:iso(new Date(y,m2,0)), corta:MESES[m1-1]+'–'+MESES[m2-1], nombre:MESES[m1-1]+'–'+MESES[m2-1]+' '+y};
}
function tempMover(id,d){ var p=id.split('-'), y=+p[0], k=+p[1]+d; if(k<0){k=5;y-=1;} if(k>5){k=0;y+=1;} return y+'-'+k; }
function primeraTemp(){
  var min=null; S.loans.forEach(function(l){ if(min===null||l.out<min) min=l.out; });
  var cur=tempDe(hoy()); if(!min) return cur;
  var a=tempDe(min); return a>cur && a.slice(0,4)>=cur.slice(0,4) ? cur : a;
}
function puntosDe(l,h){ if(l.ret) return (l.back && l.back>l.due) ? 5 : 15; return l.due<h ? 0 : 10; }
function tabla(ini,fin){
  var h=hoy(), BM={}, porCatLibros={};
  S.books.forEach(function(b){ BM[b.code]=b; if(!b.baja) porCatLibros[b.cat]=(porCatLibros[b.cat]||0)+1; });
  var late={}; S.loans.forEach(function(l){ if(!l.ret && l.due<h) late[l.reader]=(late[l.reader]||0)+1; });
  var R={}, porB={}, porC={}, n=0, sinFecha=0;
  S.loans.forEach(function(l){
    if((ini && l.out<ini) || (fin && l.out>fin)) return;
    n+=1; var r=R[l.reader]||(R[l.reader]={pts:0,n:0,at:0,tarde:0,curso:0,atras:0});
    var p=puntosDe(l,h); r.pts+=p; r.n+=1;
    if(p===15) r.at+=1; else if(p===5) r.tarde+=1; else if(p===10) r.curso+=1; else r.atras+=1;
    if(l.ret && !l.back) sinFecha+=1;
    porB[l.book]=(porB[l.book]||0)+1; var b=BM[l.book]; if(b) porC[b.cat]=(porC[b.cat]||0)+1;
  });
  var todos=Object.keys(R).filter(function(id){return lector(id);}).map(function(id){ var x=R[id]; x.id=id; x.name=lector(id).name; x.late=late[id]||0; return x; });
  var ord=function(a,b){ return b.pts-a.pts || b.at-a.at || (llave(a.name)<llave(b.name)?-1:1); };
  var eleg=todos.filter(function(x){return !x.late && x.pts>0;}).sort(ord), fuera=todos.filter(function(x){return x.late>0;}).sort(ord);
  var prev=null, pos=0; eleg.forEach(function(x,i){ if(x.pts!==prev){ pos=i+1; prev=x.pts; } x.pos=pos; });
  var libros=Object.keys(porB).filter(function(c){return BM[c];}).map(function(c){ return {code:c, title:BM[c].title, n:porB[c]}; }).sort(function(a,b){ return b.n-a.n || (a.code<b.code?-1:1); });
  prev=null; pos=0; libros.forEach(function(x,i){ if(x.n!==prev){ pos=i+1; prev=x.n; } x.pos=pos; });
  var cats=SEED.cats.map(function(c){ var k=porC[c]||0, nb=porCatLibros[c]||0; return {cat:c, n:k, libros:nb, porLibro: nb?k/nb:0}; }).sort(function(a,b){ return b.n-a.n; });
  return {n:n, eleg:eleg, fuera:fuera, libros:libros, cats:cats, sinFecha:sinFecha};
}
function salon(){
  var cur=tempDe(hoy()), id=tempMover(cur,-1), prim=primeraTemp(), out=[], g=0;
  if(prim===cur) return out;
  while(g<60){ g+=1; var inf=tempInfo(id), T=tabla(inf.ini,inf.fin), gan=T.eleg.filter(function(x){return x.pos===1;});
    if(T.n) out.push({info:inf, gan:gan, top:T.eleg.slice(0,3)});
    if(id===prim) break; id=tempMover(id,-1); }

}

function copiar(txt, ok, falla){

}

    copiar(m,function(){aviso('Ranking copiado');},function(){ abrirHoja('Ranking','<p class="sub">Selecciona el texto y cópialo.</p><textarea class="in copia" readonly>'+esc(m)+'</textarea>'); });
  },
  dias:function(d){ ui.pr.days=+d.d; pintar(); },
  confirmarprestamo:function(){
    var p=ui.pr, r=prestar(p.book,p.reader,p.days||S.settings.days);
    if(typeof r==='string'){ ui.err=r; pintar(); return; }
    var b=libro(p.book), le=lector(p.reader), id=r.id, due=S.loans[S.loans.length-1].due;
    ui.pr={book:null,reader:null,days:null,q:'',cat:'',rq:'',alta:false,err:''}; ui.err='';
    ir('inicio',false);
    aviso('Prestado a '+le.name.split(' ')[0]+' hasta el '+f(due), function(){ S.loans=S.loans.filter(function(l){return l.id!==id;}); guardar(); });
  },
  prestareste:function(d){ cerrarHoja(); ui.pr.book=d.code; ir('prestar',false); },
  devolver:function(d){
    var l=S.loans.filter(function(x){return x.id===d.id;})[0]; if(!l) return;
    var abierta=document.querySelector('.hoja'), b=libro(l.book);
    if(devolver(d.id)){
      if(abierta) cerrarHoja();
      pintar();
      aviso('Devuelto: '+b.title.slice(0,40)+(b.title.length>40?'…':''), function(){ l.ret=false; l.back=null; guardar(); });
    }
  },
  deshacer:function(){ if(deshacer){ deshacer(); deshacer=null; clearTimeout(tAviso); document.getElementById('aviso').innerHTML=''; pintar(); aviso('Deshecho'); } },
  copiarmsg:function(d){
    var l=S.loans.filter(function(x){return x.id===d.id;})[0]; if(!l) return; var m=mensaje(l);
    copiar(m,function(){aviso('Mensaje copiado');},function(){ abrirHoja('Mensaje de recordatorio','<p class="sub">Selecciona el texto y cópialo.</p><textarea class="in" readonly>'+esc(m)+'</textarea>'); });
  },
  unir:function(d){ var a=lector(d.a), b=lector(d.b); if(unir(d.a,d.b)){ pintar(); aviso('Unidos como '+a.name); } },
  descartar:function(d){ if(S.descartes.indexOf(d.k)<0){ S.descartes.push(d.k); guardar(); } pintar(); },
  copiartabla:function(d){
    var t=tsv(d.t);
    copiar(t,function(){ ui.copia=''; pintar(); aviso('Copiado. Pégalo en Excel.'); },function(){ ui.copia=t; pintar(); var c=document.getElementById('copia'); if(c){ c.focus(); c.select(); } });
  },
  plazo:function(d){ var n=document.getElementById('a-nombre').value, m=document.getElementById('a-msg').value; S.settings.days=+d.d; guardar(); pintar(); document.getElementById('a-nombre').value=n; document.getElementById('a-msg').value=m; },
  guardarajustes:function(){
    var n=document.getElementById('a-nombre').value.replace(/\s+/g,' ').trim(), m=document.getElementById('a-msg').value.trim();
    if(!n){ ui.err='Escribe el nombre de la biblioteca.'; pintar(); return; }
    if(m.length<10){ ui.err='El mensaje es muy corto.'; pintar(); document.getElementById('a-nombre').value=n; return; }
    S.settings.name=n.slice(0,40); S.settings.msg=m.slice(0,400); ui.err=''; guardar(); pintar(); aviso('Ajustes guardados');
  },
  pedirreinicio:function(){ ui.confirma=true; pintar(); },
  noreiniciar:function(){ ui.confirma=false; pintar(); },
  reiniciar:function(){ S=nuevo(); guardadoRoto=false; guardar(); ui.confirma=false; ir('inicio',false); aviso('Datos de ejemplo cargados de nuevo'); },
  altacat:function(d){ var t=document.getElementById('l-titulo').value, a=document.getElementById('l-autor').value; ui.altaCat=d.c; pintar(); document.getElementById('l-titulo').value=t; document.getElementById('l-autor').value=a; },
  guardarlibro:function(){
    var c=document.getElementById('l-codigo').value, t=document.getElementById('l-titulo').value, a=document.getElementById('l-autor').value;
    var r=crearLibro(c,t,a,ui.altaCat||SEED.cats[0]);
    if(r.e){ ui.err=r.e; pintar(); document.getElementById('l-codigo').value=c; document.getElementById('l-titulo').value=t; document.getElementById('l-autor').value=a; return; }
    ui.err=''; pila=[]; ir('catalogo',false); ui.q=r.b; pintar(); aviso('Agregado: '+r.b);
  }
};
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]'); if(!el) return;
  if(el.disabled) return;
  var fn=A[el.dataset.act]; if(fn) fn(el.dataset,el,ev);
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset.q){ ui.q=t.value; ui.lim=40; var L=document.getElementById('lista'); if(L) L.innerHTML=(ruta==='prestamos'?listaPrestamos():ruta==='catalogo'?listaCatalogo():listaLectores()); }
  else if(t.dataset.pq==='libro'){ ui.pr.q=t.value; document.getElementById('lista-libros').innerHTML=listaLibrosPrestar(); }
  else if(t.dataset.pq==='lector'){ ui.pr.rq=t.value; document.getElementById('lista-lectores').innerHTML=listaLectoresPrestar(); }
});
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') cerrarHoja(); });

window.__biblio={tabla:tabla,pie:datosPie,salon:salon,tempInfo:tempInfo,tempDe:tempDe,texto:textoRanking,estado:function(){return S;},prestar:prestar,devolver:devolver,crearLector:crearLector,crearLibro:crearLibro,valido:valido,tsv:tsv,KEY:KEY};
pintar();
})();
</script>
